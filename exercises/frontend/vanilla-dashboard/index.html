<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A task dashboard built as a frontend practice project." />
    <title>Task Grind</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">Frontend practice</p>
        <h1>Task Grind</h1>
        <p>Plan the work. Finish the work. Learn from the bugs.</p>
      </header>

      <section class="panel" aria-labelledby="new-task-heading">
        <h2 id="new-task-heading">New task</h2>
        <form id="task-form" novalidate>
          <div class="field">
            <label for="task-title">Task title</label>
            <input id="task-title" name="title" autocomplete="off" aria-describedby="title-error" />
            <p id="title-error" class="error" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <button type="submit">Add task</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="tasks-heading">
        <div class="section-heading">
          <div>
            <h2 id="tasks-heading">Tasks</h2>
            <p id="task-summary">0 open · 0 completed</p>
          </div>
          <label class="search">
            <span>Search</span>
            <input id="task-search" type="search" placeholder="Search tasks" />
          </label>
        </div>

        <div id="task-filters" class="filters" aria-label="Filter tasks">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="open" aria-pressed="false">Open</button>
          <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>

        <ul id="task-list" class="task-list"></ul>
        <p id="empty-state" class="empty-state">No tasks yet. Add the first one above.</p>
      </section>
    </main>
  </body>
</html>
